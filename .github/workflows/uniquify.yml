name: Auto-rename buffered songs

on:
  push:
    paths:
      - 'music/**/*.json'
      - '!music/**/blueprint.json'   # only the paired song .json triggers — not
                                      # the per-genre blueprint.json (avoids a
                                      # second run re-renaming the same song)
  workflow_dispatch: {}

# One at a time — never two renamers committing at once.
concurrency:
  group: uniquify
  cancel-in-progress: false

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip + Whisper model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-uniquify-whisper-medium-v1

      - name: Install dependencies
        run: pip install anthropic faster-whisper

      - name: Transcribe + title songs (and auto-post immediate ones)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: python scripts/uniquify_songs.py
