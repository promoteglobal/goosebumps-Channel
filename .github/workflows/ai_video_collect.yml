name: AI Video Collect (post finished Kaggle renders)

# COLLECTOR half of the decoupled AI-video pipeline. kaggle_render.py (kickoff
# mode) pushes a multi-hour render to Kaggle and exits. This runs on a schedule:
# when the Kaggle render finishes, it downloads the clips and builds + posts the
# video. Each tick is a SHORT job, so a full-quality NO-LOOP render (hours on
# Kaggle) never bumps into GitHub's 6-hour per-job cap.

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes
  workflow_dispatch: {}

concurrency:
  group: ai-video-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install kaggle
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Check Kaggle render & download if finished
        id: collect
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/kaggle_collect.py

      - name: Install FFmpeg (static build with drawtext) + fonts
        if: ${{ steps.collect.outputs.ready == 'true' }}
        run: |
          set -e
          if curl -fsSL -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
            mkdir -p /tmp/ffx
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffx
            sudo cp "$(find /tmp/ffx -type f -name ffmpeg  | head -1)" /usr/local/bin/ffmpeg
            sudo cp "$(find /tmp/ffx -type f -name ffprobe | head -1)" /usr/local/bin/ffprobe
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          else
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          if ! ffmpeg -hide_banner -filters 2>/dev/null | grep -q drawtext; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-core || true

      - name: Build video from AI clips
        if: ${{ steps.collect.outputs.ready == 'true' }}
        env:
          AI_CLIPS_DIR: output/ai_clips
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/create_video.py "${{ steps.collect.outputs.mp3 }}"

      - name: Upload to YouTube (UNLISTED while testing)
        if: ${{ steps.collect.outputs.ready == 'true' }}
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YT_PRIVACY: unlisted
        run: python scripts/upload_youtube.py

      - name: Record posted render_id (idempotency)
        if: ${{ steps.collect.outputs.ready == 'true' }}
        run: |
          git config user.name "goosebumps-bot"
          git config user.email "bot@goosebumps-channel"
          echo "${{ steps.collect.outputs.render_id }}" > output/ai_last_posted.txt
          git add output/ai_last_posted.txt
          git commit -m "collector: posted AI render ${{ steps.collect.outputs.render_id }}"
          for i in 1 2 3 4 5; do
            git fetch origin main -q
            if git rebase origin/main && git push; then echo "recorded"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "could not record render_id (non-fatal)"; exit 0
